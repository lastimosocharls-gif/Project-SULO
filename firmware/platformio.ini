; ════════════════════════════════════════════════════════════════
; SULO ESP32 Firmware — PlatformIO Configuration
; Smart Utility for Local Organic Waste
; Cloud-based multi-unit biogas digester monitoring
; ════════════════════════════════════════════════════════════════

[env:sulo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ─── Build Flags ───
; Uncomment to enable debug mode
; build_flags = -DDEBUG_MODE

; ─── Library Dependencies ───
lib_deps =
    ; Sensor libraries
    paulstoffregen/OneWire@^2.3.7           ; DS18B20 temperature sensor
    milesburton/DallasTemperature@^3.11.0   ; DS18B20 library
    adafruit/Adafruit BMP280 Library@^2.6.8  ; BMP280 pressure sensor
    
    ; Display libraries
    adafruit/Adafruit SSD1306@^2.5.9         ; OLED display
    adafruit/Adafruit GFX Library@^1.11.10   ; Graphics library
    
    ; Communication libraries
    arduino-libraries/IRremote@^4.4.0        ; IR remote control
    bblanchon/ArduinoJson@^7.0.3             ; JSON serialization

; ─── Upload Settings ───
upload_speed = 921600
upload_port = auto

; ─── Monitor Settings ───
monitor_filters = esp32_exception_decoder
